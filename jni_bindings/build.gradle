plugins {
    id 'com.android.library'
}

android {
    namespace = 'me.shadow.eclipselauncher.sdl'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    // The native libraries come from tools/build_native.sh, which runs CMake
    // directly and stages libSDL3.so (plus the eclipseexec libraries it hands
    // over to) into src/main/jniLibs. Gradle packages what is there; it does
    // not build the .so files itself, so the same build works on a machine
    // that only has an NDK and a JDK, and CI never compiles the C twice.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            // tools/build_native.sh strips each library the moment it is
            // staged, so there is nothing left for AGP to remove and nothing
            // it should be asked to run. Without this the strip task goes
            // looking for an NDK of its own choosing — not the pinned one the
            // natives were built with — and warns, or fails, depending on
            // which one happens to be installed. One stripper, one set of
            // bytes: the AAR, the release zips and the export check all read
            // the same files. Consumers still strip for their own APK; this is
            // not published with the AAR.
            keepDebugSymbols += ['**/*.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            // Renaming anything in here breaks the RegisterNatives binding in
            // JNI_OnLoad or the GetStaticMethodID lookups in nativeSetupJNI,
            // and it breaks them at runtime on a user's device. The keep rules
            // live in consumer-rules.pro so they reach the app that includes
            // this AAR, not just this module.
            minifyEnabled false
        }
    }
}
